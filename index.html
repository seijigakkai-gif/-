<!-- ▼▼ Firebase 連携スクリプト（エラー原因特定版） ▼▼ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Firebaseの設定
        const firebaseConfig = {
            apiKey: "AIzaSyDS_oWl3VV3lUe4h95VGflptuOkItvFM18",
            authDomain: "try-it-1-5d336.firebaseapp.com",
            projectId: "try-it-1-5d336",
            storageBucket: "try-it-1-5d336.firebasestorage.app",
            messagingSenderId: "717290415891",
            appId: "1:717290415891:web:c6d9b27e84fe410e25dce6",
            measurementId: "G-LBTF406BMJ"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Firebaseの初期化に成功しました");
        } catch (error) {
            alert("【致命的なエラー】Firebaseの接続設定が間違っているか、読み込みに失敗しました。\n" + error.message);
        }

        // --- 画面遷移 ---
        window.navigate = function(pageId) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if(pageId === 'task') updateTaskView();
        };

        // --- 役職選択状態の保持 ---
        const roleSelect = document.getElementById('role-select');
        if(localStorage.getItem('selectedRole')) {
            roleSelect.value = localStorage.getItem('selectedRole');
        }
        roleSelect.addEventListener('change', (e) => {
            localStorage.setItem('selectedRole', e.target.value);
            if(document.getElementById('page-task').classList.contains('active')) updateTaskView();
        });

        // --- チャット機能 ---
        const msgContainer = document.getElementById('chat-messages');
        const txtName = document.getElementById('chat-name');
        const txtMsg = document.getElementById('chat-text');
        
        try {
            const q = query(collection(db, "chats"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                msgContainer.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'chat-msg';
                    msgDiv.innerHTML = `<div class="chat-name">${data.name}</div><div>${data.text}</div>`;
                    msgContainer.appendChild(msgDiv);
                });
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }, (error) => {
                alert("【チャット読み込みエラー】\n権限がないか、通信がブロックされています。\n" + error.message);
            });
        } catch(error) {}

        // 送信ボタンを押したときの処理（ここでエラーをキャッチします）
        document.getElementById('chat-send').addEventListener('click', async () => {
            if(!txtName.value.trim()) return alert("名前を入力してください");
            if(!txtMsg.value.trim()) return;
            
            try {
                // データベースへ保存処理
                await addDoc(collection(db, "chats"), {
                    name: txtName.value.trim(),
                    text: txtMsg.value.trim(),
                    createdAt: serverTimestamp()
                });
                txtMsg.value = ''; // 成功したら入力欄を空にする
                // alert("保存に成功しました！"); // テスト用（成功時はアラートを出さない場合はコメントアウト）
            } catch (error) {
                // ★失敗した場合、画面に強制的に原因を表示する★
                alert("【保存失敗】\nクラウドへの保存が弾かれました。\n\n詳細な原因: " + error.message);
            }
        });

        // --- タスク管理（共有メモ）機能 ---
        const taskMemo = document.getElementById('task-memo');
        taskMemo.addEventListener('blur', async () => {
            try {
                await setDoc(doc(db, "tasks", "shared_memo"), { text: taskMemo.value });
            } catch (error) {
                alert("【メモ保存失敗】\n詳細な原因: " + error.message);
            }
        });
        
        try {
            onSnapshot(doc(db, "tasks", "shared_memo"), (docSnap) => {
                if(docSnap.exists() && document.activeElement !== taskMemo) {
                    taskMemo.value = docSnap.data().text;
                }
            });
        } catch(error) {}

        function updateTaskView() {
            const currentRole = roleSelect.value;
            if(!currentRole) {
                document.getElementById('memo-view').style.display = 'block';
                document.getElementById('sheet-view').style.display = 'none';
            } else {
                document.getElementById('memo-view').style.display = 'none';
                document.getElementById('sheet-view').style.display = 'block';
                document.getElementById('sheet-title').innerText = `${currentRole} - タスク管理シート`;
            }
        }

        // --- カレンダー機能（UIのみ） ---
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        window.changeMonth = function(diff) {
            currentMonth += diff;
            if(currentMonth < 0) { currentMonth = 11; currentYear--; }
            else if(currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        };

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            document.getElementById('cal-month-label').innerText = `${currentYear}年 ${currentMonth + 1}月`;
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            days.forEach(d => {
                const header = document.createElement('div');
                header.className = 'cal-cell-header'; header.innerText = d; grid.appendChild(header);
            });
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            for(let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'cal-cell'; empty.style.background = '#f5f5f5'; grid.appendChild(empty);
            }
            for(let i = 1; i <= daysInMonth; i++) {
                const cell = document.createElement('div'); cell.className = 'cal-cell';
                cell.innerHTML = `<div class="cal-date">${i}</div><div class="cal-content" contenteditable="true"></div>`;
                grid.appendChild(cell);
            }
        }
        renderCalendar();

        // --- 役員相関図アップロード機能 ---
        const fileInput = document.getElementById('file-input');
        const uploadStatus = document.getElementById('upload-status');
        const chartImage = document.getElementById('chart-image');

        try {
            onSnapshot(doc(db, "settings", "org_chart"), (docSnap) => {
                if(docSnap.exists()) {
                    chartImage.src = docSnap.data().url;
                    chartImage.style.display = 'inline-block';
                    document.getElementById('upload-btn').innerText = "画像を変更する";
                }
            });
        } catch(error) {}

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            uploadStatus.innerText = "画像を最適化中...";
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    uploadStatus.innerText = "クラウドに保存中...";
                    try {
                        await setDoc(doc(db, "settings", "org_chart"), { url: compressedBase64 });
                        uploadStatus.innerText = "アップロード完了！";
                    } catch(error) {
                        alert("【画像保存失敗】\n詳細な原因: " + error.message);
                        uploadStatus.innerText = "エラーが発生しました";
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
